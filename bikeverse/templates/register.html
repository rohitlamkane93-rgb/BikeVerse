<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register | BikeVerse</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937,
            #374151
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.register-card {

    width: 100%;

    max-width: 430px;

    background: white;

    padding: 35px;

    border-radius: 20px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.30);

    animation:
        cardShow
        0.7s
        ease;
}


@keyframes cardShow {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(0.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }
}


.logo {

    text-align: center;

    font-size: 28px;

    font-weight: 700;

    color: #111827;

    margin-bottom: 8px;
}


.subtitle {

    text-align: center;

    color: #6b7280;

    margin-bottom: 28px;
}


.form-group {

    margin-bottom: 18px;
}


label {

    display: block;

    font-size: 14px;

    font-weight: 600;

    color: #374151;

    margin-bottom: 7px;
}


input {

    width: 100%;

    padding: 13px;

    border:
        1px solid #d1d5db;

    border-radius: 9px;

    font-size: 14px;

    outline: none;

    transition:
        border 0.2s ease,
        box-shadow 0.2s ease;
}


input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,0.10);
}


button {

    width: 100%;

    border: none;

    padding: 13px;

    border-radius: 9px;

    background: #111827;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        0.25s ease;
}


button:hover {

    background: #2563eb;

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(37,99,235,0.25);
}


.messages {

    margin-bottom: 18px;
}


.message {

    padding: 10px;

    border-radius: 8px;

    background: #fee2e2;

    color: #991b1b;

    font-size: 13px;

    margin-bottom: 8px;
}


.login-link {

    text-align: center;

    margin-top: 22px;

    font-size: 14px;

    color: #6b7280;
}


.login-link a {

    color: #2563eb;

    text-decoration: none;

    font-weight: 600;
}


.login-link a:hover {

    text-decoration: underline;
}


.back-home {

    display: block;

    text-align: center;

    margin-top: 18px;

    color: #6b7280;

    text-decoration: none;

    font-size: 13px;
}


.back-home:hover {

    color: #111827;
}

</style>

</head>


<body>


<div class="register-card">


    <div class="logo">
        🏍️ BikeVerse
    </div>


    <div class="subtitle">
        Create your BikeVerse account
    </div>


    {% if messages %}

    <div class="messages">

        {% for message in messages %}

        <div class="message">
            {{ message }}
        </div>

        {% endfor %}

    </div>

    {% endif %}


    <form
        method="POST"
    >

        {% csrf_token %}


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >

        </div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </div>


    <a
        href="{% url 'home' %}"
        class="back-home"
    >
        ← Back to BikeVerse
    </a>


</div>


</body>

</html>
